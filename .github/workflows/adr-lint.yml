name: ADR Lint

on:
  pull_request:
    paths:
      - "docs/adrs/**"
      - "docs/adr/**"
      - ".agents/scripts/adr/**"
  push:
    branches: [main]
    paths:
      - "docs/adrs/**"
      - "docs/adr/**"
      - ".agents/scripts/adr/**"

permissions:
  contents: read

jobs:
  validate-adrs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validar ADRs
        run: python3 .agents/scripts/adr/validate_adrs.py
